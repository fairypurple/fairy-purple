
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9c9fa">
  <meta name="description" content="Fairy Purple: mi pequeño mundo de fanfics, reseñas, fotos e ídolos.">
  <title>Fairy Purple ♡ My Little World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="layout-art" aria-hidden="true"></div>

    <nav class="side-nav" aria-label="Navegación principal">
      <div class="site-logo">🦋 Fairy Purple</div>
      <button class="nav-button active" data-page="home">⌂ Home</button>
      <button class="nav-button" data-page="about">♡ About Me</button>
      <button class="nav-button" data-page="fanfics">❀ FanFics</button>
      <button class="nav-button" data-page="reviews">☆ Reviews</button>
      <button class="nav-button" data-page="gallery">▧ Gallery</button>
      <button class="nav-button" data-page="idols">♡ My Idols</button>
    </nav>

    <section class="music-box">
      <h3>♫ My Little Playlist</h3>
      <p>Music makes everything magical ♡</p>
      <audio controls preload="none">
        <source src="music.mp3" type="audio/mpeg">
        Tu navegador no admite audio.
      </audio>
      <small>Añadiremos tu música cuando esté preparada.</small>
    </section>

    <section class="content-window">
      <header class="window-bar">
        <span>♥</span>
        <span id="window-title">welcome to my little world</span>
        <span>♡</span>
      </header>
      <div id="page-content" class="page-content">
        <p>Loading my little world... 💜</p>
      </div>
    </section>

    <footer class="tiny-credit">made with ♡ by Fairy Purple</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
