<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#d9c9fa"><meta name="description" content="Fairy Purple: mi pequeño mundo de fanfics, reseñas, fotos e ídolos.">
<title>Fairy Purple ♡ My Little World</title><link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage" aria-label="Fairy Purple, página personal">
  <div class="layout-art" aria-hidden="true"></div>
  <nav class="side-nav" aria-label="Navegación principal">
    <button class="nav-button active" data-page="home"><span>⌂</span> Home</button>
    <button class="nav-button" data-page="about"><span>♡</span> About Me</button>
    <button class="nav-button" data-page="fanfics"><span>❀</span> FanFics</button>
    <button class="nav-button" data-page="reviews"><span>☆</span> Reviews</button>
    <button class="nav-button" data-page="gallery"><span>▧</span> Gallery</button>
    <button class="nav-button" data-page="idols"><span>♡</span> My Idols</button>
  </nav>
  <section class="music-box" aria-label="Reproductor de música">
    <div class="music-title">♡ XingQiu Playlist ♡</div>
    <div class="track-row"><div class="track-cover" id="track-cover">🦋</div><div class="track-meta"><strong id="track-name">Añade tu canción</strong><small id="track-artist">Fairy Purple playlist</small></div></div>
    <audio id="audio" preload="metadata"></audio>
    <div class="progress-wrap"><input id="seek" type="range" min="0" max="100" value="0" aria-label="Posición de la canción"><div class="time-row"><span id="current-time">0:00</span><span id="duration">0:00</span></div></div>
    <div class="player-controls"><button id="prev" aria-label="Canción anterior" title="Anterior">|◀</button><button id="play" class="play-button" aria-label="Reproducir" title="Reproducir">▶</button><button id="next" aria-label="Siguiente canción" title="Siguiente">▶|</button></div>
    <div class="volume-row"><span>♪</span><input id="volume" type="range" min="0" max="1" step="0.05" value="0.75" aria-label="Volumen"><span>♫</span></div>
    <p class="music-help">Canciones en la carpeta /music</p>
  </section>
  <section class="content-window" aria-live="polite">
    <header class="window-bar"><span class="window-heart">♥</span><span id="window-title">welcome to my little world</span><span class="window-dots">♡</span></header>
    <div id="page-content" class="page-content"></div>
  </section>
  <div class="tiny-credit">made with ♡ by Fairy Purple</div>
</main>
<script src="script.js"></script>
</body></html>
